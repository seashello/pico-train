apiVersion: v1
kind: Pod
metadata:
  name: babylm-eval
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: NotIn
            values: ["k8s-chase-ci-01.calit2.optiputer.net", "nautilus-ext-gpu01.fullerton.edu"]
  containers:
  - name: main
    image: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime
    command: ["sleep", "14400"]
    envFrom:
    - secretRef:
        name: keys
    volumeMounts:
    - name: vol
      mountPath: /vol
    resources:
      requests:
        cpu: "4"
        memory: 16Gi
        nvidia.com/gpu: 1
      limits:
        cpu: "4"
        memory: 16Gi
        nvidia.com/gpu: 1
  volumes:
  - name: vol
    persistentVolumeClaim:
      claimName: babylm-vol