apiVersion: v1
kind: Pod
metadata:
  name: babylm-debug2
spec:
  restartPolicy: Never
  containers:
  - name: main
    image: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime
    command: ["sleep", "3600"]
    volumeMounts:
    - name: vol
      mountPath: /vol
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 2Gi
  volumes:
  - name: vol
    persistentVolumeClaim:
      claimName: babylm-vol2